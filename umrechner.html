<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umrechner & Wissenschaftsrechner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020; --card:#111827; --muted:#9ca3af; --text:#e5e7eb; --accent:#3b82f6; --accent-2:#8b5cf6;
  --border:#1f2937; --input:#0b1220; --success:#10b981;
}
:root.light{
  --bg:#f8fafc; --card:#ffffff; --muted:#64748b; --text:#0f172a; --accent:#2563eb; --accent-2:#7c3aed;
  --border:#e2e8f0; --input:#ffffff; --success:#059669;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);transition:.3s}
header{position:sticky;top:0;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--border);z-index:10}
.nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.brand{font-weight:700;font-size:18px;display:flex;gap:10px;align-items:center}
.brand span{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.toggle{display:flex;align-items:center;gap:8px}
.switch{width:44px;height:24px;background:var(--border);border-radius:999px;position:relative;cursor:pointer}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:var(--text);border-radius:50%;transition:.2s}
:root.light .switch::after{left:23px}
.container{max-width:1200px;margin:28px auto;padding:0 20px}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px;gap:4px;margin-bottom:18px}
.tab{padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;font-size:14px;color:var(--muted);transition:.2s}
.tab.active{background:var(--accent);color:white}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.grid{display:grid;gap:16px}
@media(min-width:900px){.grid-3{grid-template-columns:repeat(3,1fr)} .grid-2{grid-template-columns:repeat(2,1fr)}}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
select,input{width:100%;padding:12px 14px;background:var(--input);border:1px solid var(--border);color:var(--text);border-radius:12px;font-size:15px}
.result{font-size:28px;font-weight:700;margin-top:16px}
.result span{color:var(--accent)}
footer{color:var(--muted);text-align:center;margin:40px 0;font-size:13px}
.calc{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.calc-display{background:var(--input);border:1px solid var(--border);border-radius:16px;padding:16px;font-size:32px;text-align:right;min-height:72px;word-break:break-all}
.calc-btn{padding:16px;font-size:18px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-weight:600;transition:.15s}
.calc-btn:active{transform:scale(.98)}
.calc-btn.op{background:color-mix(in srgb,var(--accent) 20%,var(--card));border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.calc-btn.eq{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:white;border:none}
.calc-btn.func{font-size:14px}
.hidden{display:none}
@media(max-width:640px){.calc{grid-template-columns:repeat(4,1fr)} .calc-display{font-size:24px}}
</style>
</head>
<body>
<header>
<div class="nav">
<div class="brand">🧮 <span>Umrechner Pro</span></div>
<div class="toggle">
<span id="modeLabel">Dark</span>
<div class="switch" id="themeToggle" title="Dark / Light"></div>
</div>
</div>
</header>

<div class="container">
<div class="tabs">
<div class="tab active" data-tab="converter">Umrechner</div>
<div class="tab" data-tab="calc">Wissenschaftsrechner</div>
</div>

<section id="converter" class="card">
<div class="grid grid-3">
<div>
<label>Kategorie</label>
<select id="catSel"></select>
</div>
<div>
<label>Von</label>
<select id="fromSel"></select>
</div>
<div>
<label>Nach</label>
<select id="toSel"></select>
</div>
<div style="grid-column:1/-1">
<label>Wert</label>
<input id="valueIn" type="number" step="any" placeholder="0">
</div>
</div>
<div class="result" id="convResult">—</div>
</section>

<section id="calc" class="card hidden">
<div class="calc-display" id="calcDisplay">0</div>
<div class="calc">
<button class="calc-btn func" data-k="C">C</button>
<button class="calc-btn func" data-k="(">(</button>
<button class="calc-btn func" data-k=")">)</button>
<button class="calc-btn func" data-k="⌫">⌫</button>
<button class="calc-btn op" data-k="%">%</button>

<button class="calc-btn func" data-k="sin(">sin</button>
<button class="calc-btn func" data-k="cos(">cos</button>
<button class="calc-btn func" data-k="tan(">tan</button>
<button class="calc-btn func" data-k="log(">log</button>
<button class="calc-btn op" data-k="÷">÷</button>

<button class="calc-btn func" data-k="sqrt(">√</button>
<button class="calc-btn func" data-k="ln(">ln</button>
<button class="calc-btn func" data-k="π">π</button>
<button class="calc-btn func" data-k="e">e</button>
<button class="calc-btn op" data-k="×">×</button>

<button class="calc-btn" data-k="7">7</button>
<button class="calc-btn" data-k="8">8</button>
<button class="calc-btn" data-k="9">9</button>
<button class="calc-btn func" data-k="^">^</button>
<button class="calc-btn op" data-k="-">−</button>

<button class="calc-btn" data-k="4">4</button>
<button class="calc-btn" data-k="5">5</button>
<button class="calc-btn" data-k="6">6</button>
<button class="calc-btn func" data-k="1/x">1/x</button>
<button class="calc-btn op" data-k="+">+</button>

<button class="calc-btn" data-k="1">1</button>
<button class="calc-btn" data-k="2">2</button>
<button class="calc-btn" data-k="3">3</button>
<button class="calc-btn func" data-k=".">.</button>
<button class="calc-btn eq" data-k="=">=</button>

<button class="calc-btn" data-k="0" style="grid-column:span 2">0</button>
</div>
</section>
</div>

<footer>© 2026 molex2go • MIT • Offline nutzbar</footer>

<script>
const categories = {
  "Länge":{base:"m",units:{ "Meter m":1,"Kilometer km":1000,"Zentimeter cm":0.01,"Millimeter mm":0.001,"Meile mi":1609.344,"Yard yd":0.9144,"Fuß ft":0.3048,"Zoll in":0.0254,"Seemeile nmi":1852}},
  "Masse":{base:"kg",units:{ "Kilogramm kg":1,"Gramm g":0.001,"Tonne t":1000,"Pfund lb":0.45359237,"Unze oz":0.0283495231}},
  "Fläche":{base:"m²",units:{ "Quadratmeter m²":1,"Hektar ha":10000,"Acre ac":4046.86}},
  "Volumen":{base:"m³",units:{ "Kubikmeter m³":1,"Liter l":0.001,"Milliliter ml":0.000001,"Gallone US gal":0.00378541}},
  "Temperatur":{isTemp:true,units:{ "Celsius °C":"C","Fahrenheit °F":"F","Kelvin K":"K"}},
  "Geschwindigkeit":{base:"m/s",units:{ "m/s":1,"km/h":0.277777778,"mph":0.44704,"Knoten":0.514444}},
  "Leistung":{base:"W",units:{ "Watt W":1,"Kilowatt kW":1000,"Pferdestärke PS":735.49875,"HP hp":745.7}},
  "Energie":{base:"J",units:{ "Joule J":1,"Kilojoule kJ":1000,"kWh":3.6e6}},
  "Druck":{base:"Pa",units:{ "Pascal Pa":1,"Bar bar":1e5,"mbar":100,"PSI psi":6894.76}},
  "Kraft":{base:"N",units:{ "Newton N":1,"Kilopond kp":9.80665}},
  "Zeit":{base:"s",units:{ "Sekunde s":1,"Minute min":60,"Stunde h":3600,"Tag d":86400}},
  "Winkel":{base:"rad",units:{ "Grad °":Math.PI/180,"Radiant rad":1}},
  "Datenmenge":{base:"B",units:{ "Byte B":1,"KB":1024,"MB":1024**2,"GB":1024**3}}
};

const catSel=document.getElementById('catSel');
const fromSel=document.getElementById('fromSel');
const toSel=document.getElementById('toSel');
const valueIn=document.getElementById('valueIn');
const convResult=document.getElementById('convResult');

Object.keys(categories).forEach((k,i)=>{const o=new Option(k,k); if(i===0)o.selected; catSel.add(o);});
function populateUnits(){
  const cat=categories[catSel.value];
  const units=cat.isTemp?Object.keys(cat.units):Object.keys(cat.units);
  fromSel.innerHTML=''; toSel.innerHTML='';
  units.forEach((u,i)=>{fromSel.add(new Option(u,u)); toSel.add(new Option(u,u));});
  if(units.length>1) toSel.selectedIndex=1;
}
populateUnits();
function toC(v,u){if(u.includes('°C'))return v; if(u.includes('°F'))return (v-32)*5/9; if(u.includes('K'))return v-273.15; return v}
function fromC(c,u){if(u.includes('°C'))return c; if(u.includes('°F'))return c*9/5+32; if(u.includes('K'))return c+273.15; return c}
function convert(){
  const v=parseFloat(valueIn.value); if(isNaN(v)){convResult.textContent='—';return}
  const cat=categories[catSel.value];
  const f=fromSel.value, t=toSel.value;
  let out;
  if(cat.isTemp){out=fromC(toC(v,f),t)} else {out=v*cat.units[f]/cat.units[t]}
  const s=Math.abs(out)>1e12||(Math.abs(out)<1e-6&&out!==0)?out.toExponential(6):Number.isInteger(out)?out: +out.toFixed(6);
  convResult.innerHTML=`${v} <span>${f}</span> = <span>${s}</span> ${t}`;
}
catSel.onchange=populateUnits; catSel.onchange=convert;
fromSel.onchange=convert; toSel.onchange=convert; valueIn.oninput=convert;
convert();

/* Tabs */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById('converter').classList.toggle('hidden', t.dataset.tab!=='converter');
  document.getElementById('calc').classList.toggle('hidden', t.dataset.tab!=='calc');
});

/* Theme */
const root=document.documentElement;
const toggle=document.getElementById('themeToggle');
const modeLabel=document.getElementById('modeLabel');
function setTheme(light){root.classList.toggle('light',light); modeLabel.textContent=light?'Light':'Dark'; localStorage.setItem('theme',light?'light':'dark')}
setTheme(localStorage.getItem('theme')!=='light');
toggle.onclick=()=>setTheme(!root.classList.contains('light'));

/* Scientific Calculator */
const display=document.getElementById('calcDisplay');
let expr='';
function updateDisp(){display.textContent=expr||'0'}
document.querySelectorAll('.calc-btn').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k;
  if(k==='='){try{
    let e=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/π/g,'Math.PI').replace(/e(?![a-zA-Z])/g,'Math.E');
    // degrees for trig
    e=e.replace(/sin\(/g,'Math.sin(').replace(/cos\(/g,'Math.cos(').replace(/tan\(/g,'Math.tan(');
    // convert deg to rad
    e=e.replace(/Math\.(sin|cos|tan)\(([^)]+)\)/g,(m,fn,arg)=>`Math.${fn}(${arg}*Math.PI/180)`);
    e=e.replace(/log\(/g,'Math.log10(').replace(/ln\(/g,'Math.log(').replace(/sqrt\(/g,'Math.sqrt(').replace(/\^/g,'**');
    const res=Function('return '+e)();
    expr=String(+res.toFixed(12));
  }catch{expr='Error'} updateDisp();
  }else if(k==='C'){expr=''; updateDisp();}
  else if(k==='⌫'){expr=expr.slice(0,-1); updateDisp();}
  else{expr+=k; updateDisp();}
});
updateDisp();
</script>
</body>
</html>
